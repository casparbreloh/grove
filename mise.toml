monorepo_root = true

[monorepo]
config_roots = ["apps/*", "packages/*"]

[settings]
experimental = true

[tools]
aube = "1"
node = "26"

[deps.aube]
auto = true

[tasks]
build = { depends = [{ task = "//...:build", optional = true }] }
check = { depends = ["doctor", "doctor-design", "format-check", "lint", "test", "typecheck"] }
desktop = { depends = [{ task = "//apps/desktop:dev" }] }
doctor = "aube exec react-doctor apps/desktop --verbose"
doctor-design = "aube exec react-doctor design apps/desktop --verbose"
format = "aube exec oxfmt --write ."
format-check = "aube exec oxfmt --check ."
lint = "aube exec oxlint ."
test = { depends = [{ task = "//...:test", optional = true }] }
typecheck = { depends = ["build"], run = "aube exec tsc -b" }
