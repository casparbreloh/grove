name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache aube
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/aube/store
            ~/.cache/aube
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: aube-${{ runner.os }}-

      - name: Check
        run: mise run check
